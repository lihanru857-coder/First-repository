<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冬日来信 · 无限祝福</title>
<style>
    /* ====== 基础设置 ====== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        width: 100vw; height: 100vh;
        overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #f4f7f9 0%, #e0e8f0 100%);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* ====== 飘雪背景 ====== */
    .snow-container {
        position: absolute; inset: 0; pointer-events: none; z-index: 1;
    }
    .snowflake {
        position: absolute; top: -10px;
        color: #a8c6df; font-size: 1.2em;
        animation: fall linear infinite;
    }
    @keyframes fall {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    /* ====== 信封样式 ====== */
    .envelope-wrapper {
        position: relative;
        z-index: 100;
        perspective: 1000px;
        transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* 信封打开后整体淡出缩小 */
    .envelope-wrapper.opened {
        opacity: 0;
        transform: scale(0.6) translateY(-50px);
        pointer-events: none;
    }

    .envelope {
        position: relative;
        width: 320px; height: 220px;
        background: #fdfbfb;
        border-radius: 8px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.08), 0 3px 10px rgba(0,0,0,0.05);
        cursor: pointer;
        transition: transform 0.3s ease;
    }
    .envelope:hover {
        transform: translateY(-5px);
    }

    /* 信封主体背景纹理 */
    .envelope-back {
        position: absolute; inset: 0;
        background: #f7f9fa;
        border-radius: 8px;
        overflow: hidden;
    }
    .envelope-back::before, .envelope-back::after {
        content: ''; position: absolute; width: 100%; height: 100%;
        border-radius: 8px;
    }
    /* 信封的交叉折线 */
    .envelope-back::before {
        background: linear-gradient(45deg, transparent 48%, #e8ecf1 49%, #e8ecf1 51%, transparent 52%);
    }
    .envelope-back::after {
        background: linear-gradient(-45deg, transparent 48%, #e8ecf1 49%, #e8ecf1 51%, transparent 52%);
    }

    /* 信封上盖（翻开的部分） */
    .envelope-flap {
        position: absolute;
        top: 0; left: 0;
        width: 0; height: 0;
        border-left: 160px solid transparent;
        border-right: 160px solid transparent;
        border-top: 120px solid #ffffff;
        border-radius: 8px 8px 0 0;
        transform-origin: top;
        transition: transform 0.6s ease, border-color 0.6s ease, z-index 0s 0.3s;
        z-index: 3;
        filter: drop-shadow(0 4px 2px rgba(0,0,0,0.03));
    }

    /* 火漆印章/提示文字 */
    .envelope-seal {
        position: absolute; top: 90px; left: 50%;
        transform: translate(-50%, -50%);
        width: 60px; height: 60px;
        background: #ff9a9e;
        border-radius: 50%;
        display: flex; justify-content: center; align-items: center;
        color: white; font-size: 24px;
        box-shadow: 0 4px 10px rgba(255, 154, 158, 0.4);
        z-index: 4;
        transition: opacity 0.3s ease;
        animation: pulse 2s infinite;
    }
    
    .envelope-text {
        position: absolute; bottom: 30px; left: 0; width: 100%;
        text-align: center; color: #7b88a8; font-size: 14px;
        letter-spacing: 2px; font-weight: 600;
        z-index: 2;
    }

    /* --- 拆信封动画 --- */
    .envelope.open .envelope-flap {
        transform: rotateX(180deg);
        border-top-color: #f0f4f8;
        z-index: 0; /* 翻转到最底层 */
    }
    .envelope.open .envelope-seal {
        opacity: 0;
    }

    @keyframes pulse {
        0% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.08); }
        100% { transform: translate(-50%, -50%) scale(1); }
    }

    /* ====== 卡片容器 ====== */
    .cards-container {
        position: absolute;
        width: 100vw; height: 100vh;
        display: flex; justify-content: center; align-items: center;
        pointer-events: none; /* 允许点击穿透 */
        z-index: 10;
    }

    /* ====== 横向卡片样式 ====== */
    .card {
        position: absolute;
        top: 50%; left: 50%;
        width: 300px;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.05);
        overflow: hidden;
        pointer-events: auto;
        
        /* 初始状态：在中心极小，完全透明 */
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2);
        /* 弹出动画曲线，带弹性 */
        transition: transform 0.7s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.5s ease;
    }

    .card-header {
        height: 34px;
        background: rgba(255, 255, 255, 0.9);
        display: flex; align-items: center;
        padding: 0 12px;
        border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    
    .mac-dots { display: flex; gap: 6px; margin-right: 12px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }
    
    .card-title {
        font-size: 12px; color: #7b88a8; font-weight: 500;
        display: flex; align-items: center; gap: 5px;
    }

    .card-body {
        padding: 20px 22px;
        min-height: 95px;
        display: flex; align-items: center;
        font-size: 15px;
        font-weight: 600;
        color: #333;
        line-height: 1.6;
    }
</style>
</head>
<body>

    <!-- 飘雪背景 -->
    <div class="snow-container" id="snowContainer"></div>

    <!-- 信封区 -->
    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="envelope" id="envelope">
            <div class="envelope-back"></div>
            <div class="envelope-flap"></div>
            <div class="envelope-seal">❄️</div>
            <div class="envelope-text">点击拆开信封</div>
        </div>
    </div>

    <!-- 卡片存放区 -->
    <div class="cards-container" id="cardsContainer"></div>

<script>
    /* ================= 飘雪效果 ================= */
    const snowContainer = document.getElementById('snowContainer');
    const snowflakeChars = ['❅', '❆', '❄', '·'];
    
    function createSnow() {
        const snow = document.createElement('div');
        snow.className = 'snowflake';
        snow.textContent = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
        
        // 随机位置、大小、下落时间和延迟
        snow.style.left = Math.random() * 100 + 'vw';
        snow.style.fontSize = (Math.random() * 10 + 10) + 'px';
        snow.style.opacity = Math.random() * 0.5 + 0.3;
        const duration = Math.random() * 5 + 5;
        snow.style.animationDuration = duration + 's';
        snow.style.animationDelay = '-' + Math.random() * 5 + 's'; // 负数让雪花一开始就在屏幕中间
        
        snowContainer.appendChild(snow);
    }
    // 生成 50 片雪花
    for(let i=0; i<50; i++) { createSnow(); }

    /* ================= 游戏逻辑 ================= */
    const envelopeWrapper = document.getElementById('envelopeWrapper');
    const envelope = document.getElementById('envelope');
    const container = document.getElementById('cardsContainer');

    // 数据池
    const texts = [
        "学会爱自己，才能更好地爱别人",
        "这个冬天我们会见面吗？",
        "一起过冬❄️吗",
        "天冷记得加衣 🧣",
        "所有美好也如约而至",
        "是新的冬天，有你的冬天",
        "愿所有烦恼都消失",
        "记得多穿衣服哦～",
        "冬日快乐，平安喜乐",
        "万事胜意，顺问冬安",
        "祝你在这个冬天，收获满满的爱",
        "希望你的每一天都充满阳光☀️"
    ];
    
    const colors = [
        "#FFE4E1", // 浅粉
        "#E0F7FA", // 浅蓝
        "#E8F5E9", // 浅绿
        "#E3F2FD", // 天蓝
        "#FFF3E0", // 浅橙
        "#F3E5F5", // 浅紫
        "#FFF9C4"  // 浅黄
    ];

    let zIndexCounter = 10; 
    let cardCount = 0;      
    let isOpened = false;
    let spawnTimeout; // 用于记录循环的定时器

    // 1. 点击拆信封
    envelope.addEventListener('click', () => {
        if (isOpened) return;
        isOpened = true;

        // 播放信封打开动画
        envelope.classList.add('open');

        // 稍微延迟一下（等盖子翻上去），再让信封整体消失
        setTimeout(() => {
            envelopeWrapper.classList.add('opened');
            
            // 信封消失的同时，开始疯狂弹卡片
            setTimeout(() => {
                spawnCard();
            }, 300);
        }, 400);
    });

    // 2. 生成卡片的函数
    function spawnCard() {
        // 随机抽取文案和颜色
        const text = texts[Math.floor(Math.random() * texts.length)];
        const color = colors[Math.floor(Math.random() * colors.length)];
        
        // 随机位置和旋转角度
        const randomX = (Math.random() - 0.5) * 280; 
        const randomY = (Math.random() - 0.5) * 450;
        const randomRot = (Math.random() - 0.5) * 16; 
        
        const card = document.createElement('div');
        card.className = 'card';
        
        // 关键：后生成的盖在前面生成的上面
        card.style.zIndex = zIndexCounter++;
        
        card.innerHTML = `
            <div class="card-header">
                <div class="mac-dots">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <div class="card-title">❄️ 冬日快乐</div>
            </div>
            <div class="card-body" style="background-color: ${color};">
                ${text}
            </div>
        `;

        container.appendChild(card);

        // 强制浏览器重绘，确保动画触发
        void card.offsetWidth;

        // 触发飞行动画
        card.style.opacity = '1';
        card.style.transform = `translate(calc(-50% + ${randomX}px), calc(-50% + ${randomY}px)) scale(1) rotate(${randomRot}deg)`;

        cardCount++;

        // 性能优化：超过 70 张后，移除最旧的
        if (cardCount > 70) {
            const firstCard = container.firstElementChild;
            if (firstCard) {
                firstCard.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                firstCard.style.opacity = '0';
                firstCard.style.transform += ' scale(0.8)';
                setTimeout(() => firstCard.remove(), 800);
                cardCount--;
            }
        }

        // 随机间隔不断循环（500ms ~ 1100ms）
        const nextDelay = 500 + Math.random() * 600;
        spawnTimeout = setTimeout(spawnCard, nextDelay);
    }
</script>

</body>
</html>
