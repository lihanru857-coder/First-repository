<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>冬日来信</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
    background: linear-gradient(160deg, #0f1b2d 0%, #1c3350 45%, #2b4a6f 100%);
    color: #f5efe6;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  /* 雪花 */
  .snow {
    position: fixed; top: -10px; color: #fff; opacity: .75;
    pointer-events: none; user-select: none; z-index: 1;
    animation: fall linear infinite;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
  }

  /* 主容器 */
  .stage {
    position: relative; z-index: 2;
    width: min(92vw, 420px);
    height: min(86vh, 640px);
    display: flex; align-items: center; justify-content: center;
  }

  /* 信封 */
  .envelope {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity .7s ease, transform .7s ease;
  }
  .envelope.hide {
    opacity: 0; transform: translateY(-40px) scale(.96);
    pointer-events: none;
  }
  .envelope .icon {
    font-size: 92px; line-height: 1;
    filter: drop-shadow(0 12px 24px rgba(0,0,0,.35));
    animation: float 3.5s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .envelope h1 {
    margin-top: 22px; font-size: 22px; letter-spacing: 6px;
    font-weight: 500; color: #f7e7c6;
  }
  .envelope p {
    margin-top: 10px; font-size: 13px; letter-spacing: 2px;
    color: rgba(245,239,230,.55);
  }
  .open-btn {
    margin-top: 34px; padding: 12px 34px;
    border: 1px solid rgba(247,231,198,.6);
    border-radius: 999px; background: transparent;
    color: #f7e7c6; font-size: 15px; letter-spacing: 3px;
    font-family: inherit; cursor: pointer;
    transition: all .3s ease;
  }
  .open-btn:active { background: rgba(247,231,198,.15); transform: scale(.97); }

  /* 信纸 */
  .letter {
    position: absolute; inset: 0;
    padding: 34px 28px 26px;
    border-radius: 14px;
    background: linear-gradient(180deg, #fbf6ec 0%, #f2e8d5 100%);
    color: #3a2f24;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    opacity: 0; transform: translateY(28px) scale(.97);
    transition: opacity .8s ease, transform .8s ease;
    pointer-events: none;
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .letter.show {
    opacity: 1; transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .letter .top-line {
    text-align: center; color: #b08d57; font-size: 13px;
    letter-spacing: 4px; margin-bottom: 18px;
  }
  .letter h2 {
    text-align: center; font-size: 20px; letter-spacing: 5px;
    font-weight: 600; margin-bottom: 22px; color: #4a3826;
  }
  .letter p {
    font-size: 15px; line-height: 2; letter-spacing: 1px;
    margin-bottom: 14px;
    opacity: 0; transform: translateY(12px);
    transition: opacity .8s ease, transform .8s ease;
  }
  .letter p.in { opacity: 1; transform: translateY(0); }
  .letter .sign {
    margin-top: auto; padding-top: 18px;
    text-align: right; font-size: 13px; color: #8b6f4c;
    letter-spacing: 2px;
    opacity: 0; transition: opacity .8s ease;
  }
  .letter .sign.in { opacity: 1; }

  .hint {
    position: fixed; bottom: 18px; left: 0; right: 0;
    text-align: center; font-size: 12px; letter-spacing: 2px;
    color: rgba(245,239,230,.35); z-index: 2;
  }
</style>
</head>
<body>

  <div class="stage">
    <!-- 信封界面 -->
    <div class="envelope" id="envelope">
      <div class="icon">✉️</div>
      <h1>冬日来信</h1>
      <p>有一封来自冬天的信，等你拆开</p>
      <button class="open-btn" id="openBtn">拆 开 信 封</button>
    </div>

    <!-- 信纸界面 -->
    <div class="letter" id="letter">
      <div class="top-line">❄ 冬 日 来 信 ❄</div>
      <h2>致 冬 日 里 的 你</h2>
      <p>风把最后一片叶子送回了街角，</p>
      <p>我把想说的话折成一小片雪，</p>
      <p>轻轻落在你的屏幕上。</p>
      <p>愿你在这个冬天：</p>
      <p>手边有热茶，心里有暖意，</p>
      <p>打开这封信时，刚好想起一个温暖的人。</p>
      <div class="sign">—— 来自：李翰儒</div>
    </div>
  </div>

  <div class="hint">轻触拆信 · 冬日限定</div>

<script>
  // ====== 雪花 ======
  (function makeSnow() {
    const chars = ['❄', '❅', '❆', '·'];
    const count = 26;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      s.className = 'snow';
      s.textContent = chars[Math.floor(Math.random() * chars.length)];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.fontSize = (8 + Math.random() * 14) + 'px';
      s.style.animationDuration = (6 + Math.random() * 8) + 's';
      s.style.animationDelay = (-Math.random() * 10) + 's';
      document.body.appendChild(s);
    }
  })();

  // ====== 拆信交互 ======
  const envelope = document.getElementById('envelope');
  const letter = document.getElementById('letter');
  const openBtn = document.getElementById('openBtn');
  const paragraphs = letter.querySelectorAll('p');
  const sign = letter.querySelector('.sign');

  function openLetter() {
    envelope.classList.add('hide');
    setTimeout(() => {
      letter.classList.add('show');
      // 文字逐段出现
      paragraphs.forEach((p, i) => {
        setTimeout(() => p.classList.add('in'), 350 + i * 420);
      });
      setTimeout(() => sign.classList.add('in'), 350 + paragraphs.length * 420);
    }, 500);
  }

  openBtn.addEventListener('click', openLetter);

  // 可选：整张信封也可以点
  envelope.addEventListener('click', (e) => {
    if (e.target === openBtn) return;
    openLetter();
  });
</script>
</body>
</html>
